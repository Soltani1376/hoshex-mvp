name: Hoshex V2 checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  diagnosis-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run V2 diagnosis tests
        run: node tests/run-v2-tests.cjs
      - name: Run recurring journey tests
        run: node tests/run-followup-tests.cjs
      - name: Run execution assistant tests
        run: node tests/run-execution-tests.cjs
      - name: Run compact app shell and Jalali tests
        run: node tests/run-app-shell-tests.cjs
