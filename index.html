<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>هوشکس | قدم بعدی کسب و کارت</title>
<style>
@font-face{font-family:lalezar;src:url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap')}
*{box-sizing:border-box}body{margin:0;background:#050816;color:#fff;font-family:lalezar,Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hx-bg{position:fixed;width:500px;height:500px;background:radial-gradient(circle,#00d9ff33,transparent 60%);animation:pulse 6s infinite}
@keyframes pulse{50%{transform:scale(1.3);opacity:.5}}
.hx-card{position:relative;width:min(90%,700px);padding:45px;border:1px solid #ffffff22;background:#ffffff0d;backdrop-filter:blur(20px);border-radius:32px;text-align:center;box-shadow:0 0 80px #00d9ff22}
h1{font-size:42px;margin:0 0 15px;background:linear-gradient(90deg,#00eaff,#9b6cff);-webkit-background-clip:text;color:transparent}p{font-family:Tahoma;font-size:18px;line-height:2;color:#ddd}.btn{margin-top:25px;padding:16px 35px;border:0;border-radius:50px;background:linear-gradient(90deg,#00d9ff,#7c5cff);color:white;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="hx-bg"></div>
<div class="hx-card">
<h1>مشکل کسب و کارت رو پیدا کن</h1>
<p>هوشکس کمک می‌کند بفهمی الان مهم‌ترین مشکل چیست و امروز چه کاری باید انجام بدهی.</p>
<button class="btn" onclick="start()">شروع بررسی رایگان</button>
<div id="app"></div>
</div>
<script>
function start(){document.getElementById('app').innerHTML='<p>اولین سوال: الان بزرگترین مشکل کسب و کارت چیه؟</p><input style="width:80%;padding:14px;border-radius:20px;border:0">'}
</script>
</body></html>
