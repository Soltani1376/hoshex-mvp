<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>هوشکس | تشخیص قدم بعدی کسب‌وکار</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#111;font-family:Lalezar,Tahoma,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:50px 24px;text-align:center}.brain{width:130px;height:130px;margin:20px auto 35px;border-radius:50%;background:radial-gradient(circle,#fff,#dbeafe,#818cf8);box-shadow:0 20px 70px #93c5fd;animation:float 4s infinite}@keyframes float{50%{transform:translateY(-10px)}}h1{font-size:52px;margin:0 0 18px}p{font-family:tahoma;font-size:18px;line-height:2;color:#555}.box{background:white;border-radius:32px;padding:30px;margin-top:35px;box-shadow:0 15px 50px #00000010}.choices button,.next{border:0;background:#111;color:white;padding:15px 28px;border-radius:999px;margin:8px;font-family:inherit;cursor:pointer}.choices button{background:#f3f4f6;color:#111}.hidden{display:none}.result{text-align:right;line-height:2;font-family:tahoma}
</style></head>
<body><main class="wrap"><div class="brain"></div><h1>مشکل اصلی کسب‌وکارت رو پیدا کن</h1><p>هوشکس بررسی می‌کنه الان مهم‌ترین کاری که باید برای رشد فروش انجام بدی چیه.</p><div class="box" id="app"><h2>کسب‌وکارت بیشتر از کجا مشتری می‌گیرد؟</h2><div class="choices"><button onclick="start('instagram')">اینستاگرام</button><button onclick="start('website')">سایت</button></div></div></main>
<script>
let answers=[];let type='';
const q={instagram:['چند وقت است فعالیت می‌کنی؟','بازدید داری ولی فروش کم است؟','بیشتر مشکل کجاست؟'],website:['بازدید سایت داری؟','مشتری تا خرید پیش می‌رود؟','بیشتر مشکل کجاست؟']};
function start(t){type=t;answers.push(t);ask(0)}
function ask(i){let box=document.getElementById('app');if(i>=q[type].length){analyze();return}box.innerHTML='<h2>'+q[type][i]+'</h2><button class="next" onclick="answer(\''+q[type][i]+'\')">ادامه</button>'}
function answer(a){answers.push(a);ask(answers.length-1)}
async function analyze(){document.getElementById('app').innerHTML='<h2>در حال بررسی...</h2>';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});let d=await r.json();document.getElementById('app').innerHTML='<div class="result">'+(d.result||'نتیجه آماده نشد')+'</div>'}catch(e){document.getElementById('app').innerHTML='ارتباط برقرار نشد؛ دوباره امتحان کن'}}
</script></body></html>
